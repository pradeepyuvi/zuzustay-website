<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Oops! The page you are looking for does not exist. Back to Naadhe.">
  <meta name="theme-color" content="#0d1b2a">

  <title>Page Not Found | Naadhe</title>

  <!-- Favicons & Styles -->
  <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg?v=3">
  <link rel="stylesheet" href="/assets/css/shimmer.css?v=1.0">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

  <!-- Fullscreen Background Overlay -->
  <div class="bg-wrapper"></div>

  <!-- Page Layout Wrapper -->
  <div class="page-container">

    <!-- Top Center Logo & Title -->
    <header class="logo-container">
      <a href="/" style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
        <img src="/assets/images/logo.svg" alt="Naadhe Logo" class="logo-icon">
        <div class="logo-text">Naadhe</div>
      </a>
    </header>

    <!-- Error Card Content -->
    <main class="error-page">
      <div class="error-card">
        <div class="shimmer-wrapper">
          <div class="shimmer-placeholder" style="align-items: center;">
            <div class="shimmer-title w-40" style="height: 3.5rem;"></div>
            <div class="shimmer-heading w-60"></div>
            <div class="shimmer-text w-90"></div>
            <div class="shimmer-btn w-40" style="margin-top: 1rem;"></div>
          </div>
          <div class="shimmer-real-content">
            <div class="error-code">404</div>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-desc">The page you are looking for might have been removed, had its name changed, or is
              temporarily unavailable.</p>
            <a href="/" class="back-btn">Back to Home</a>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer Area -->
    <footer>
      <div class="footer-bottom-info">
        &copy; 2026 Naadhe. All rights reserved.
      </div>
      <div class="footer-links">
        <a href="/privacy-policy.html">Privacy Policy</a>
        <a href="/terms-and-conditions.html">Terms & Conditions</a>
        <a href="mailto:support@naadhe.com" class="contact-email">support@naadhe.com</a>
      </div>
    </footer>

  </div>

  <script src="/assets/js/shimmer.js?v=1.0"></script>
</body>

</html>
